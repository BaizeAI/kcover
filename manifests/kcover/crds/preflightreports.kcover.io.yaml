apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: preflightreports.kcover.io
spec:
  group: kcover.io
  names:
    kind: PreflightReport
    listKind: PreflightReportList
    plural: preflightreports
    shortNames:
      - pfr
    singular: preflightreport
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Workload
          type: string
          jsonPath: .spec.workloadName
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Rank
          type: integer
          jsonPath: .spec.rank
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: PreflightReport spec is immutable
              required:
                - workloadName
                - workloadUID
                - nodeName
                - rank
                - report
                - observedAt
              properties:
                workloadName:
                  type: string
                  minLength: 1
                workloadUID:
                  type: string
                  minLength: 1
                nodeName:
                  type: string
                  minLength: 1
                rank:
                  type: integer
                  format: int32
                  minimum: 0
                report:
                  type: string
                  minLength: 2
                observedAt:
                  type: string
                  format: date-time
