name: CI and Release

on:
  pull_request:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  go-unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: Test
      run: make test-all

  helm-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install Helm
      uses: azure/setup-helm@v5
    - name: Test Helm chart
      run: make helm-test

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-unit-test, helm-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta Controller
        id: controller_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/baizeai/kcover-controller
          tags: |
            type=semver,pattern={{raw}}

      - name: Docker meta Agent
        id: agent_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/baizeai/kcover-agent
          tags: |
            type=semver,pattern={{raw}}

      - name: Docker meta Agent MetaX
        id: agent_metax_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/baizeai/kcover-agent-metax
          tags: |
            type=semver,pattern={{raw}}

      - name: Build Image Controller
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.controller_meta.outputs.tags }}
          labels: ${{ steps.controller_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/kcover.Dockerfile

      - name: Build Image Agent
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.agent_meta.outputs.tags }}
          labels: ${{ steps.agent_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/agent.Dockerfile

      - name: Build Image Agent MetaX
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.agent_metax_meta.outputs.tags }}
          labels: ${{ steps.agent_metax_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/agent-metax.Dockerfile
          build-args: |
            MX_SMI_IMAGE=ghcr.io/baizeai/mx-smi:v0.2

  publish-chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ docker-build ]
    permissions:
      contents: write
    env:
      HELM_CHARTS_DIR: manifests/kcover
      HELM_CHART_NAME: kcover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Get the version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Sync Helm chart version
        run: |
          image_tag=${{ steps.get_version.outputs.VERSION }}
          chart_semver=${image_tag#"v"}
          sed -i -E "s/^version: .*/version: \"${chart_semver}\"/" "$HELM_CHARTS_DIR/Chart.yaml"
          sed -i -E "s/^appVersion: .*/appVersion: \"${image_tag}\"/" "$HELM_CHARTS_DIR/Chart.yaml"

      - uses: getsentry/action-github-app-token@v4.0.0
        id: get_app_token
        with:
            app_id: ${{ secrets.APP_ID }}
            private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Sync Chart Repo
        run: |
          git config --global user.email "baize.ai[bot]@users.noreply.github.com"
          git config --global user.name "baize.ai[bot]"
          git clone https://x-access-token:${{ steps.get_app_token.outputs.token }}@github.com/BaizeAI/charts.git baize-charts
          helm package $HELM_CHARTS_DIR --destination ./baize-charts/docs/
          helm repo index --url https://baizeai.github.io/charts ./baize-charts/docs/
          cd baize-charts/
          git add docs/
          chart_version=${{ steps.get_version.outputs.VERSION }}
          chart_smever=${chart_version#"v"}
          git commit -m "update kcover chart ${chart_smever}"
          git push https://x-access-token:${{ steps.get_app_token.outputs.token }}@github.com/BaizeAI/charts.git
